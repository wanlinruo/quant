# 所有环境共用的配置。按 TRADING_MODE 叠加 dev.yaml / paper.yaml / live.yaml，
# 再由环境变量覆盖（QUANT_ 前缀，嵌套用 __，如 QUANT_EXECUTOR__CASH_BUFFER=0.03）。
# 交易模式只能用环境变量 TRADING_MODE 设置，不能写在配置文件里。
# 不得在配置文件中写入密钥、账户号。

market:
  timezone: America/New_York
  calendar: XNYS

# 美东时间，见 PROJECT_PLAN 第 8 章
schedule:
  daily_data: "16:30"
  daily_signal: "17:00"
  # 模拟盘阶段用约 15 分钟延迟行情，执行不早于开盘后 20 分钟
  daily_execute: "09:50"

# 见 PROJECT_PLAN 6.3
executor:
  cash_buffer: 0.02
  limit_offset: 0.002
  min_trade_usd: 100
  min_weight_diff: 0.02
  # 超时撤单重挂（#30 确认）
  order_timeout_minutes: 5
  max_retries: 3
  poll_seconds: 10
  stop_before_close_minutes: 30

# 见 PROJECT_PLAN 6.4
risk:
  symbol_whitelist: [SPY, QQQ, TLT, GLD, SHY]
  max_symbol_weight: 1.0
  max_total_weight: 1.0
  # 当日成交额 / 净值；月度轮动一次全仓切换约 2（#30 确认）
  max_daily_turnover: 2.2
  # 单笔订单金额上限按账户在 paper.yaml / live.yaml 中配置

# 每日任务运行的策略（PROJECT_PLAN 第 14 章）；params 为空时用策略默认参数
strategy:
  name: etf_momentum
  params: {}

# 回测成本，见 PROJECT_PLAN 第 9 章
costs:
  # 老虎美股固定式套餐（#5，2026-10-29 App 截图）：
  # 佣金 0.0039 美元/股；平台费 0.004 美元/股、每笔最低 1 美元；两项各自最多成交额的 0.5%
  # 交收费、SEC / FINRA 规费未计入（待确认）
  commission_per_share: "0.0039"
  min_commission: "0"
  platform_per_share: "0.004"
  platform_min: "1"
  max_fee_pct: "0.005"
  slippage: "0.0005"
