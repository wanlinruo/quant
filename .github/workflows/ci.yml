name: CI

# 分支模型：feat/* fix/* chore/* docs/* refactor/* --merge--> test（测试环境）--PR--> main（正式环境）
on:
  pull_request:
    branches: [main]
  push:
    branches: [test, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only test may open PRs into main
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "main" ] && [ "$HEAD" != "test" ]; then
            echo "::error::main 只接受来自 test 的 PR（当前来自 $HEAD）"
            exit 1
          fi

  check:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: sim
      # 仅供 CI 内一次性数据库使用的测试口令，不是任何真实环境的密钥
      QUANT_TEST_DATABASE_URL: postgresql+psycopg://quant:ci-only@localhost:5432/quant_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image（只验证 Dockerfile，不推送；部署由 Phase 4 的 deploy.yml 负责）
        run: docker build --tag quant:ci .

      - name: Smoke test
        run: |
          docker run --rm -e TRADING_MODE=sim quant:ci \
            python -c "from quant.core.settings import load_settings; s = load_settings(); assert s.trading_mode == 'sim', s; print('ok', s.broker)"
