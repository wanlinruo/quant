[project]
name = "quant"
version = "0.1.0"
description = "个人美股量化交易系统"
authors = [
    { name = "wanlinruo", email = "394688215@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "tigeropen>=3.8.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# 中文注释、文案中的全角标点是正常写法
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
# 设计文档中的代码块是示意，不参与格式化
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tigeropen.*", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
