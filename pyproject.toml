[project]
name = "quant"
version = "0.1.0"
description = "个人美股量化交易系统"
authors = [
    { name = "wanlinruo", email = "394688215@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
# 设计文档中的代码块是示意，不参与格式化
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]  # scripts/ 有 .py 后加入
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
