# 服务定义（服务器与本地共用）。本地用 make up 叠加 compose.dev.yml。
# 变量来自同目录 .env（不提交）；POSTGRES_PASSWORD 必须设置。
name: quant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_DB: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    restart: unless-stopped
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
    volumes:
      - parquet:/data/parquet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
    # 服务器上不对公网开放端口；访问方式见 PROJECT_PLAN 13.2（Tailscale），Phase 4 配置

  backtest-worker:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "quant.jobs.backtest_worker"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
      # 服务器回测数据（#66）：空闲时用 Tiingo 补齐日线、用 SEC EDGAR 补历史财报日
      QUANT_TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      QUANT_EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
    volumes:
      - parquet:/data/parquet
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 2m  # 收到 SIGTERM 后处理完当前回测再退出
    # 回测不得影响交易任务（PROJECT_PLAN 第 3 章）；具体数值待 #6 资源实测后调整
    # 组合回测加载约 780 只候选池日线，构造阶段实测约 1.3 GB（#66 审查），留出余量
    cpus: 1.0
    mem_limit: 3072m

  # 每日任务（数据 → 信号 → 执行 → 日报）。连接券商，只在服务器上启用：
  # .env 中设置 COMPOSE_PROFILES=scheduler 与 TIGER_PROPS_DIR（老虎配置文件所在目录，权限 600，
  # 属主 uid 须为 1000，与镜像内 quant 用户一致）
  scheduler:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    profiles: ["scheduler"]
    restart: unless-stopped
    command: ["python", "-m", "quant.jobs.scheduler"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
      QUANT_NOTIFY_WEBHOOK_URL: ${QUANT_NOTIFY_WEBHOOK_URL:-}
      QUANT_MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}  # 首页市场看板 market_data 任务（#69）
      QUANT_FRED_API_KEY: ${FRED_API_KEY:-}  # 首页宏观与经济数据实际值 market_extras（#69）
      QUANT_FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}  # 首页新闻与财报日历 market_extras（#69）
      TIGER_PROPS_PATH: /run/tiger/
    volumes:
      - parquet:/data/parquet
      - ${TIGER_PROPS_DIR:-/nonexistent}:/run/tiger:ro
    depends_on:
      postgres:
        condition: service_healthy
    # 收到停止信号后等当前任务跑完再退出：stock_data 约 14 分钟，部署时不强杀（#79）。
    # 执行中仍被停止时，重启后会先恢复券商订单状态再继续（engine/executor.py）
    stop_grace_period: 20m

  # 只读的 Docker 查询代理（#63、#71）：按路径白名单只放行 GET 容器列表、单个容器的
  # inspect 与 stats；读取容器文件（archive / export）、日志、镜像、exec 等一律拒绝。
  # 只在内部网络 dockerproxy 上（不映射端口），只有 monitor 能访问
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.2
    profiles: ["scheduler"]
    restart: unless-stopped
    command:
      - -loglevel=warn
      - -listenip=0.0.0.0
      - -allowfrom=0.0.0.0/0  # 网络 dockerproxy 为 internal，只有 monitor 接入
      - -allowGET=^/(v[0-9.]+/)?containers/(json|[0-9a-f]{12,64}/(json|stats))$$
    user: "0:0"  # 读 docker.sock 需要；已去掉全部 capability
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dockerproxy]
    mem_limit: 64m

  # 每 60 秒采集主机与容器资源写入 system_metrics（系统页资源卡、服务容器、趋势）
  monitor:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    profiles: ["scheduler"]
    restart: unless-stopped
    command: ["python", "-m", "quant.jobs.monitor"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
      QUANT_DOCKER_URL: http://docker-proxy:2375
    volumes:
      - parquet:/data/parquet:ro
    networks: [default, dockerproxy]
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    cpus: 0.2
    mem_limit: 256m

  # 盘中行情（#93）：常规时段约每 10 分钟取一轮全市场 Finnhub 报价，重算首页盘中快照，只供查看。
  # 不挂老虎配置、不导入券商代码，与交易链路隔离
  quotes:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    profiles: ["scheduler"]
    restart: unless-stopped
    command: ["python", "-m", "quant.jobs.quotes"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
      QUANT_FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      QUANT_FRED_API_KEY: ${FRED_API_KEY:-}  # 盘中新闻/财经日历，与报价顺序调度
    volumes:
      - parquet:/data/parquet  # 读日线与成分表，写 market/snapshot_intraday.json
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m

networks:
  dockerproxy:
    internal: true

volumes:
  pgdata:
  parquet:
