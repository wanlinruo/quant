# 服务定义（服务器与本地共用）。本地用 make up 叠加 compose.dev.yml。
# 变量来自同目录 .env（不提交）；POSTGRES_PASSWORD 必须设置。
name: quant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_DB: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    restart: unless-stopped
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
    volumes:
      - parquet:/data/parquet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
    # 服务器上不对公网开放端口；访问方式见 PROJECT_PLAN 13.2（Tailscale），Phase 4 配置

  backtest-worker:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "quant.jobs.backtest_worker"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
      # 服务器回测数据（#66）：空闲时用 Tiingo 补齐日线、用 SEC EDGAR 补历史财报日
      QUANT_TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      QUANT_EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
    volumes:
      - parquet:/data/parquet
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 2m  # 收到 SIGTERM 后处理完当前回测再退出
    # 回测不得影响交易任务（PROJECT_PLAN 第 3 章）；具体数值待 #6 资源实测后调整
    # 组合回测加载约 780 只候选池日线，构造阶段实测约 1.3 GB（#66 审查），留出余量
    cpus: 1.0
    mem_limit: 3072m

  # 每日任务（数据 → 信号 → 执行 → 日报）。连接券商，只在服务器上启用：
  # .env 中设置 COMPOSE_PROFILES=scheduler 与 TIGER_PROPS_DIR（老虎配置文件所在目录，权限 600，
  # 属主 uid 须为 1000，与镜像内 quant 用户一致）
  scheduler:
    image: ${QUANT_IMAGE:-quant:local}
    build: .
    profiles: ["scheduler"]
    restart: unless-stopped
    command: ["python", "-m", "quant.jobs.scheduler"]
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      QUANT_DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD}@postgres:5432/quant
      QUANT_NOTIFY_WEBHOOK_URL: ${QUANT_NOTIFY_WEBHOOK_URL:-}
      QUANT_MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}  # 首页市场看板 market_data 任务（#69）
      TIGER_PROPS_PATH: /run/tiger/
    volumes:
      - parquet:/data/parquet
      - ${TIGER_PROPS_DIR:-/nonexistent}:/run/tiger:ro
    depends_on:
      postgres:
        condition: service_healthy
    # 执行中被停止时，重启后会先恢复券商订单状态再继续（engine/executor.py）
    stop_grace_period: 2m

volumes:
  pgdata:
  parquet:
